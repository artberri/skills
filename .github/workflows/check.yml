name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares with the previous commit or the PR's base.
          fetch-depth: 0
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: ShellCheck
        run: git ls-files -z "*.sh" "scripts/evals/stubs/*" | xargs -0 shellcheck -x
      - name: shfmt
        run: shfmt -d .
      - name: Validate skills
        run: scripts/check.sh
        env:
          ARTBERRI_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Test hooks
        run: hooks/git-guardrails/test.sh
      - name: Test add-template.sh
        run: scripts/test-add-template.sh
      - name: Test retro's session reader
        run: python3 -I skills/portable/retro/scripts/test_extract_sessions.py
