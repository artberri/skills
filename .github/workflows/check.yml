name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: ShellCheck
        run: git ls-files -z "*.sh" | xargs -0 shellcheck -x
      - name: shfmt
        run: shfmt -d .
      - name: Validate skills
        run: scripts/check.sh
